name: Precious
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '3 0 * * SUN'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precious:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - run: pnpm install --frozen-lockfile
      # Always lint the whole repo, on both pushes and pull requests. Linting
      # only a PR's changed files misses reformats the PR itself triggers
      # outside its diff -- e.g. a dependency bump that changes a formatter
      # version can leave unrelated files unformatted, and PR CI would not
      # catch it. The repo is small, so linting everything is cheap.
      - name: Lint files
        run: precious lint --all
