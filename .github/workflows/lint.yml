name: Precious
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '3 0 * * SUN'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precious:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      # Always lint the whole repo, on both pushes and pull requests. Linting
      # only a PR's changed files misses reformats the PR itself triggers
      # outside its diff -- e.g. a dependency bump that changes a formatter
      # version can leave unrelated files unformatted, and PR CI would not
      # catch it. The repo is small, so linting everything is cheap.
      - name: Lint files
        run: precious lint --all
